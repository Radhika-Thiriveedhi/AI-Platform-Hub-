{% extends "base.html" %}
{% block title %}Contact – {{ app_name }}{% endblock %}
{% block content %}
<section class="section">
<div class="container narrow">
    <h1 class="page-title">Contact Us</h1>
    <p class="page-subtitle">Have a question, feedback, or enterprise inquiry? We would love to hear from you.</p>
    {% if message %}
    <div class="alert alert-success">{{ message }}</div>
    {% endif %}
    <form method="post" class="contact-form">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" class="input" required>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" class="input" required>
            </div>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" class="input">
        </div>
        <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="6" class="input" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
    </form>
</div>
</section>
{% endblock %}
